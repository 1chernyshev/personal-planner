function waitForSupabase(timeoutMs){
  return new Promise(resolve => {
    if(window.supabase && window.supabase.createClient){ resolve(true); return; }
    let elapsed = 0;
    const tick = setInterval(() => {
      if(window.supabase && window.supabase.createClient){
        clearInterval(tick); resolve(true);
      } else if(elapsed >= timeoutMs){
        clearInterval(tick); resolve(false);
      }
      elapsed += 50;
    }, 50);
  });
}

function hideSplash(){
  const s = document.getElementById('splash');
  if(!s) return;
  s.style.opacity = '0';
  setTimeout(() => { s.style.display = 'none'; }, 300);
}

let currentUser = null;
let isGuestMode = false;
let authMode = 'signin';   // 'signin' | 'signup'
let syncTimer = null;
let isSyncing = false;

function setAuthMode(m){
  authMode = m;
  document.getElementById('tab-signin').classList.toggle('active', m==='signin');
  document.getElementById('tab-signup').classList.toggle('active', m==='signup');
  document.getElementById('auth-submit').textContent = m==='signin' ? 'Войти' : 'Создать аккаунт';
  authMsg('');
}
function authMsg(text, kind){
  const el = document.getElementById('auth-msg');
  if(!text){ el.innerHTML = ''; return; }
  el.innerHTML = `<div class="auth-msg ${kind||'err'}">${escHTML(text)}</div>`;
}
async function submitAuth(){
  if(!sb){ authMsg('Облачные аккаунты недоступны — используй кнопку «Без аккаунта»'); return; }
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  if(!email || !password){ authMsg('Заполни email и пароль'); return; }
  if(password.length < 6){ authMsg('Пароль минимум 6 символов'); return; }
  const btn = document.getElementById('auth-submit');
  btn.disabled = true;
  btn.textContent = '...';
  try{
    if(authMode==='signup'){
      const { data, error } = await sb.auth.signUp({ email, password });
      if(error) throw error;
      if(data.session){
        await onSignedIn(data.session);
      } else {
        authMsg('Проверь почту и подтверди регистрацию, потом войди', 'ok');
        setAuthMode('signin');
      }
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if(error) throw error;
      await onSignedIn(data.session);
    }
  } catch(e){
    authMsg(translateAuthError(e.message));
  } finally {
    btn.disabled = false;
    btn.textContent = authMode==='signin' ? 'Войти' : 'Создать аккаунт';
  }
}
function translateAuthError(msg){
  if(/invalid login|invalid credentials/i.test(msg)) return 'Неверный email или пароль';
  if(/already registered|user.*exists/i.test(msg)) return 'Email уже зарегистрирован — нажми «Войти»';
  if(/password should be at least/i.test(msg)) return 'Пароль слишком короткий (минимум 6 символов)';
  if(/email.*invalid/i.test(msg)) return 'Email указан неверно';
  if(/rate limit|too many/i.test(msg)) return 'Слишком много попыток, подожди минуту';
  return msg;
}

async function onSignedIn(session){
  currentUser = session.user;
  isGuestMode = false;
  await loadFromCloud();
  enterApp();
}

async function loadFromCloud(){
  try{
    const { data, error } = await sb.from('user_data').select('data').eq('user_id', currentUser.id).maybeSingle();
    if(error) throw error;
    if(data && data.data && data.data.events){
      DB = data.data;
      saveDB(false);  // mirror to localStorage for offline reads, no cloud-push
    } else {
      /* First login: if local data exists, migrate it; otherwise fresh */
      const local = localStorage.getItem(STORAGE_KEY);
      if(local){
        const parsed = JSON.parse(local);
        if(parsed && parsed.events){ DB = parsed; }
        else DB = freshDB();
      } else {
        DB = freshDB();
      }
      await saveToCloud();
    }
  } catch(e){
    console.error('loadFromCloud failed', e);
    toast('Не удалось загрузить данные из облака — работаем локально');
  }
}

function scheduleSync(){
  if(isGuestMode || !currentUser) return;
  if(syncTimer) clearTimeout(syncTimer);
  setSyncStatus('syncing');
  syncTimer = setTimeout(saveToCloud, 800);
}

async function saveToCloud(){
  if(!currentUser || !sb) return;
  isSyncing = true;
  try{
    const { error } = await sb.from('user_data').upsert({
      user_id: currentUser.id,
      data: { ...DB, _scheduledNotifs: undefined },
      updated_at: new Date().toISOString(),
    });
    if(error) throw error;
    setSyncStatus('synced');
  } catch(e){
    console.error('saveToCloud failed', e);
    setSyncStatus('error');
  } finally {
    isSyncing = false;
  }
}

function setSyncStatus(status){
  const el = document.getElementById('sync-status');
  if(!el) return;
  if(status==='syncing'){ el.textContent = '⟳ синхронизация…'; el.className = 'sync-status syncing'; }
  else if(status==='synced'){ el.textContent = '✓ сохранено в облако'; el.className = 'sync-status'; setTimeout(()=>{ if(el.textContent==='✓ сохранено в облако') el.textContent=''; }, 1500); }
  else if(status==='error'){ el.textContent = '⚠ ошибка синхронизации'; el.className = 'sync-status error'; }
  else { el.textContent = ''; el.className = 'sync-status'; }
}

async function signOut(){
  if(!confirm('Выйти из аккаунта? Локальные данные останутся, но облачная синхронизация прекратится.')) return;
  if(currentUser){ await sb.auth.signOut(); }
  currentUser = null;
  isGuestMode = false;
  location.reload();
}

function useAsGuest(){
  isGuestMode = true;
  /* Load from localStorage as before (DB уже загружен из loadDB()) */
  enterApp();
}

function goToAuthScreen(){
  document.getElementById('main-app').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
  setAuthMode('signup');
}

function enterApp(){
  hideSplash();
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('main-app').style.display = 'block';
  document.getElementById('fab').style.display = 'flex';
  applyTheme();
  injectAccountBadge();
  showTab(activeTab);
  rescheduleNotifications();
  if('Notification' in window && Notification.permission==='granted'){
    document.getElementById('notif-btn').textContent = '🔔✓';
  }
}

function injectAccountBadge(){
  /* Add email/sync status into header */
  const actions = document.querySelector('.header-actions');
  if(!actions || document.getElementById('account-info')) return;
  const wrap = document.createElement('div');
  wrap.id = 'account-info';
  wrap.style.cssText = 'display:flex;align-items:center;gap:8px;margin-right:6px;flex-wrap:wrap';
  if(currentUser){
    wrap.innerHTML = `<span class="sync-status" id="sync-status"></span>
      <span style="font-size:12px;color:var(--text2);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escHTML(currentUser.email)}">${escHTML(currentUser.email)}</span>`;
  } else {
    wrap.innerHTML = `<span style="font-size:12px;color:var(--text3)">👤 гость</span>`;
  }
  actions.parentNode.insertBefore(wrap, actions);
}

/* Hook saveDB to push to cloud after every change */
const _saveDBLocal = saveDB;
saveDB = function(pushCloud){
  _saveDBLocal();
  if(pushCloud!==false) scheduleSync();
};

/* Real-time sync between tabs/devices */
async function subscribeRealtime(){
  if(!currentUser || !sb) return;
  sb.channel('user_data_' + currentUser.id)
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'user_data', filter: `user_id=eq.${currentUser.id}` },
      payload => {
        if(isSyncing) return;  /* ignore our own writes */
        const incoming = payload.new && payload.new.data;
        if(incoming && incoming.events && JSON.stringify(incoming) !== JSON.stringify(DB)){
          DB = incoming;
          localStorage.setItem(STORAGE_KEY, JSON.stringify({...DB, _scheduledNotifs:undefined}));
          showTab(activeTab);
          toast('↓ Данные обновились с другого устройства');
        }
      })
    .subscribe();
}

/* ============================================================
   INIT
   ============================================================ */
async function init(){
  /* Optimistic UI: if there is a local Supabase session token + cached DB,
     enter the app immediately with cached data and refresh in background. */
  const sbLocalKey = Object.keys(localStorage).find(k => k.startsWith('sb-') && k.endsWith('-auth-token'));
  const localHasData = !!localStorage.getItem(STORAGE_KEY);
  if(sbLocalKey && localHasData){
    try{
      const tok = JSON.parse(localStorage.getItem(sbLocalKey));
      if(tok && (tok.user || (tok.currentSession && tok.currentSession.user))){
        currentUser = tok.user || tok.currentSession.user;
      }
    }catch(e){}
    enterApp();   /* show UI immediately */
    /* Background: wire Supabase, sync, subscribe */
    (async () => {
      const ok = await waitForSupabase(8000);
      if(!ok) return;
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      try{
        const { data: { session } } = await sb.auth.getSession();
        if(session){
          currentUser = session.user;
          await loadFromCloud();
          if(activeTab) showTab(activeTab);
          subscribeRealtime();
        } else {
          /* Token revoked server-side → drop back to auth screen */
          location.reload();
        }
      }catch(e){ console.warn('Background auth refresh failed', e); }
      sb.auth.onAuthStateChange((event) => {
        if(event==='SIGNED_OUT'){ location.reload(); }
      });
    })();
    return;
  }

  /* Cold path: no cached session — wait for SDK then check */
  const sdkReady = await waitForSupabase(5000);
  if(sdkReady){
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  } else {
    hideSplash();
    showAuthScreenWithMsg('Облачная синхронизация недоступна. Можно работать без аккаунта.');
    return;
  }
  try{
    const { data: { session } } = await sb.auth.getSession();
    if(session){
      await onSignedIn(session);
      subscribeRealtime();
    } else {
      hideSplash();
      document.getElementById('auth-screen').style.display = 'flex';
    }
  } catch(e){
    hideSplash();
    showAuthScreenWithMsg('Не удалось подключиться к серверу. Попробуй обновить страницу или войди как гость.');
  }
  if(sb){
    sb.auth.onAuthStateChange((event, session) => {
      if(event==='SIGNED_IN' && !currentUser){ onSignedIn(session).then(subscribeRealtime); }
      if(event==='SIGNED_OUT'){ location.reload(); }
    });
  }
}
function showAuthScreenWithMsg(msg){
  document.getElementById('auth-screen').style.display = 'flex';
  setTimeout(() => authMsg(msg, 'err'), 100);
}

/* Global error handler — show readable error instead of white screen */
window.addEventListener('error', e => {
  if(document.getElementById('auth-screen').style.display === 'none' &&
     document.getElementById('main-app').style.display === 'none'){
    document.body.innerHTML = `<div style="padding:24px;font-family:-apple-system,sans-serif;max-width:520px;margin:60px auto;text-align:center">
      <div style="font-size:48px">🧭</div>
      <h2 style="margin:12px 0">Atlas</h2>
      <p style="color:#888;margin-bottom:20px">Что-то пошло не так при загрузке. Попробуй обновить страницу.</p>
      <button onclick="location.reload()" style="padding:10px 20px;background:#378ADD;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer">Обновить</button>
      <details style="margin-top:24px;text-align:left;font-size:11px;color:#aaa"><summary>Технические детали</summary><pre style="white-space:pre-wrap;margin-top:8px">${(e.message||'unknown')+'\n'+(e.filename||'')+':'+(e.lineno||'')}</pre></details>
    </div>`;
  }
});

/* Register service worker for offline + instant loads (skip on file://) */
if('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW registration failed:', e));
  });
}

/* Wait for DOM + start init */
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
